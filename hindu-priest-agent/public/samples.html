<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>आवाज़ के नमूने</title>
<style>
  :root { --bg:#fff8ec; --card:#fff; --ink:#3a2412; --muted:#7a6350; --deep:#a8430a; --line:#f0d9b5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d140c; --card:#2a1d12; --ink:#f7e6cf; --muted:#c1a688; --line:#4a3320; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font-family:"Noto Sans Devanagari","Mangal",system-ui,sans-serif; max-width:820px; margin-inline:auto; }
  h1 { color:var(--deep); font-size:1.3rem; } p.n { color:var(--muted); font-size:.92rem; }
  .grp { margin:18px 0; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .grp h2 { margin:0 0 4px; font-size:1.05rem; color:var(--deep); } .t { white-space:pre-wrap; line-height:1.8; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0; } .row b { min-width:70px; } audio { flex:1; min-width:220px; }
</style>
</head>
<body>
<h1>🎵 आवाज़ के नमूने</h1>
<p class="n">ये Indic Parler-TTS से बनी आवाज़ें हैं। हर मंत्र को अलग-अलग आवाज़ में सुनकर तय कीजिए कि कौन-सी रखनी है। सुनते समय देखिए: उच्चारण, ठहराव, और चंट जैसा लय। जो आवाज़ पसंद आए, उसका नाम बताइए।</p>
<div id="list">लोड हो रहा है…</div>
<script>
fetch('audio-samples/samples.json').then((r) => r.json()).then((items) => {
  const by = {};
  items.forEach((i) => { (by[i.title] = by[i.title] || { text: i.text, rows: [] }).rows.push(i); });
  const box = document.getElementById('list'); box.textContent = '';
  Object.entries(by).forEach(([title, g]) => {
    const d = document.createElement('div'); d.className = 'grp';
    d.innerHTML = '<h2></h2><div class="t"></div>';
    d.querySelector('h2').textContent = title; d.querySelector('.t').textContent = g.text;
    g.rows.forEach((r) => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<b></b><audio controls preload="none"></audio>';
      row.querySelector('b').textContent = r.speaker;
      row.querySelector('audio').src = 'audio-samples/' + r.file;
      d.appendChild(row);
    });
    box.appendChild(d);
  });
}).catch(() => { document.getElementById('list').textContent = 'नमूने अभी नहीं मिले। पहले चलाइए: node tools/generate-audio.js --samples'; });
</script>
</body>
</html>
